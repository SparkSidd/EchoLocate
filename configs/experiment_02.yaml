# =============================================================================
# EchoLocate - Experiment 02 Configuration
# =============================================================================
# Experiment 2: Robustness and Geometry Analysis of TDOA-Based Indoor
#               Acoustic Source Localization
#
# Part A: Environmental Robustness Study (7 RT60 levels x 6 SNR levels x 5 trials)
# Part B: Microphone Geometry Study (4 geometries x 5 conditions x 5 trials)
#
# All physical units:
#   distances: metres (m)
#   time:      seconds (s)
#   frequency: Hz
#   speed:     m/s
#   power:     dB
# =============================================================================

experiment:
  name: "experiment_02"
  title: "Robustness and Geometry Analysis of TDOA-Based Indoor Acoustic Source Localization"
  base_seed: 42
  num_noise_trials: 5

room:
  dimensions: [10.0, 6.0, 3.0]   # [length_x, width_y, height_z] in metres
  speed_of_sound: 343.0           # m/s
  sampling_rate: 16000            # Hz
  air_absorption: false           # Disabled to isolate RT60 and SNR variables strictly

source:
  type: "chirp"
  duration: 0.005         # 5 ms active chirp
  f_low: 300              # Hz
  f_high: 7000            # Hz
  amplitude: 1.0
  pad_before: 0.01        # 10 ms pre-pad
  pad_after: 0.15         # 150 ms post-pad
  positions_file: "configs/experiment_02_source_positions.csv"

# ---------------------------------------------------------------------------
# Part A: Environmental Robustness Study Grid
# ---------------------------------------------------------------------------
environmental_robustness:
  # Baseline microphone geometry used for Part A
  baseline_geometry: "geometry_a"
  
  # RT60 levels (seconds)
  rt60_values:
    - 0.0   # Anechoic (direct path only)
    - 0.1   # Very low reverberation
    - 0.2   # Mild reverberation
    - 0.3   # Moderate reverberation
    - 0.4   # Moderate-to-high reverberation
    - 0.5   # High reverberation
    - 0.6   # Strong reverberation

  # SNR levels (dB)
  # P_noise = P_signal / 10^(SNR/10)
  snr_values:
    - 60.0  # Clean / Near-silent background
    - 40.0  # High SNR / Quiet room
    - 30.0  # Moderate SNR / Office ambient
    - 20.0  # Low SNR / Active indoor ambient
    - 10.0  # Poor SNR / High noise
    - 0.0   # Extreme SNR / Noise power equal to signal power

# ---------------------------------------------------------------------------
# Part B: Microphone Geometry Study
# ---------------------------------------------------------------------------
geometry_study:
  mic_height: 1.2  # Metres (z-coordinate in 3D simulation)

  geometries:
    # Geometry A: Current Experiment 1 Baseline
    geometry_a:
      name: "Baseline Triangle (Geometry A)"
      description: "Experiment 1 baseline triangular array"
      positions:
        M1: [1.0, 1.5]
        M2: [9.0, 1.5]
        M3: [5.0, 4.5]

    # Geometry B: Wide Triangular Geometry
    geometry_b:
      name: "Wide Triangle (Geometry B)"
      description: "Wide triangular array with maximized room aperture"
      positions:
        M1: [1.0, 1.0]
        M2: [9.0, 1.0]
        M3: [5.0, 5.0]

    # Geometry C: Compact Triangular Geometry
    geometry_c:
      name: "Compact Triangle (Geometry C)"
      description: "Compact triangular cluster near room center"
      positions:
        M1: [4.0, 2.5]
        M2: [6.0, 2.5]
        M3: [5.0, 3.5]

    # Geometry D: Longitudinal Corridor-Inspired Geometry
    geometry_d:
      name: "Longitudinal Corridor Array (Geometry D)"
      description: "Longitudinally distributed array with transverse offset"
      positions:
        M1: [1.5, 3.0]
        M2: [5.0, 3.3]
        M3: [8.5, 3.0]

  # Representative acoustic conditions tested for all 4 geometries
  representative_conditions:
    - name: "Condition 1: Anechoic Clean"
      rt60: 0.0
      snr: 60.0
    - name: "Condition 2: Mild Reverb / High SNR"
      rt60: 0.2
      snr: 40.0
    - name: "Condition 3: Moderate Reverb / Medium SNR"
      rt60: 0.3
      snr: 20.0
    - name: "Condition 4: High Reverb / Medium SNR"
      rt60: 0.5
      snr: 20.0
    - name: "Condition 5: Strong Reverb / Low SNR"
      rt60: 0.6
      snr: 10.0

# ---------------------------------------------------------------------------
# Solver settings
# ---------------------------------------------------------------------------
localization:
  method: "nonlinear_least_squares"
  n_restarts: 9
  max_iterations: 1000
  tolerance: 1.0e-8

evaluation:
  distance_thresholds_m: [0.25, 0.5, 1.0, 2.0]
